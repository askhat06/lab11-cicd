name: deploy

# Manual only: never runs on pull requests, so the self-hosted runner
# never executes code from someone else's PR.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to deploy (e.g. 1.0.1, or an older one to roll back)"
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false # never cancel a deploy halfway

jobs:
  deploy:
    runs-on: self-hosted
    environment: production # waits for a reviewer before the job starts
    steps:
      - name: Deploy on this machine
        env:
          TAG: ${{ inputs.tag }}
        run: |
          IMAGE="ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          docker pull "$IMAGE:$TAG"
          docker rm -f lab11-prod 2>/dev/null || true
          docker run -d --name lab11-prod -p 8012:8000 "$IMAGE:$TAG"
          docker ps --filter name=lab11-prod
